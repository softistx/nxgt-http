name: 'Setup'
description: 'Common setup steps for CI jobs'

runs:
  using: 'composite'
  steps:
    # GitHub-hosted runners carry no Bun, and the version must match the one
    # the lockfile was written with.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    # `@nxgt/openapi-nuxt`'s specs build their fixture app with Nuxt, under
    # Node as an app is built, and Nuxt 4 wants a newer Node than the runner's.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      # No token: @nxgt/* are public on npmjs, and installing them needs no
      # authentication. Only the release job authenticates, through bunfig.toml
      # reading NPM_TOKEN.
      run: bun i --frozen-lockfile
      shell: bash
    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: latest
