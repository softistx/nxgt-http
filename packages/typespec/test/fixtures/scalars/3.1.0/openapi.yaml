components:
  schemas:
    Base64:
      type: string
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/][AQgw]==|[A-Za-z0-9+/]{2}[AEIMQUYcgkosw048]=)?$
      format: byte
      description: |-
        Standard base64 (RFC 4648, section 4) with its padding, in its one canonical
        spelling: `YR==` decodes to the same byte as `YQ==` and is not taken. The
        empty string is the encoding of no bytes.

        Specified by https://www.rfc-editor.org/rfc/rfc4648#section-4.
      x-nxgt-scalar: Base64
    Base64URL:
      type: string
      pattern: ^(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-][AQgw]|[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])?$
      format: base64-url
      description: |-
        URL-safe base64 (RFC 4648, section 5): `-` and `_`, no padding, in its one
        canonical spelling. The empty string is the encoding of no bytes.

        Specified by https://www.rfc-editor.org/rfc/rfc4648#section-5.
      x-nxgt-scalar: Base64URL
    BigInt:
      type: string
      pattern: ^(?:0|-?[1-9]\d*)$
      format: big-int
      description: |-
        An integer of any size, written as a canonical decimal string: no leading
        zero, no `+`, no `-0`, no spaces: `"123456789012345678901234567890"`.
      x-nxgt-scalar: BigInt
    CIDRv4:
      type: string
      pattern: ^(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)/(?:3[0-2]|[12]?\d)$
      format: cidr-v4
      description: |-
        An IPv4 block in CIDR notation: a dotted-quad address, `/` and a prefix
        length from 0 to 32, kept as sent: `10.0.0.0/8`. Each part of the address
        is 0 to 255 with no leading zero. The address need not be the first of the
        block.

        Specified by https://www.rfc-editor.org/rfc/rfc4632.
      x-nxgt-scalar: CIDRv4
    CIDRv6:
      type: string
      pattern: ^(?:(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|(?:[0-9a-fA-F]{1,4}:){1,7}:|(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}|(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}|(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}|(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:(?::[0-9a-fA-F]{1,4}){1,6}|:(?:(?::[0-9a-fA-F]{1,4}){1,7}|:)|(?:[0-9a-fA-F]{1,4}:){6}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|::(?:[0-9a-fA-F]{1,4}:){0,5}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?:[0-9a-fA-F]{1,4}:){1}:(?:[0-9a-fA-F]{1,4}:){0,4}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?:[0-9a-fA-F]{1,4}:){2}:(?:[0-9a-fA-F]{1,4}:){0,3}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?:[0-9a-fA-F]{1,4}:){3}:(?:[0-9a-fA-F]{1,4}:){0,2}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?:[0-9a-fA-F]{1,4}:){4}:(?:[0-9a-fA-F]{1,4}:){0,1}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?:[0-9a-fA-F]{1,4}:){5}:(?:[0-9a-fA-F]{1,4}:){0,0}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d))/(?:12[0-8]|1[01]\d|[1-9]?\d)$
      format: cidr-v6
      description: |-
        An IPv6 block in CIDR notation: an IPv6 address, `/` and a prefix length
        from 0 to 128, kept as sent: `2001:db8::/32`. The address takes every RFC
        4291 text form, in any case, with no zone, and is not normalised.

        Specified by https://www.rfc-editor.org/rfc/rfc4291.
      x-nxgt-scalar: CIDRv6
    ColorScalars:
      type: object
      required:
        - hexColorCode
        - hsl
        - hsla
        - rgb
        - rgba
      properties:
        hexColorCode:
          $ref: '#/components/schemas/HexColorCode'
        hsl:
          $ref: '#/components/schemas/HSL'
        hsla:
          $ref: '#/components/schemas/HSLA'
        rgb:
          $ref: '#/components/schemas/RGB'
        rgba:
          $ref: '#/components/schemas/RGBA'
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      format: country-code
      description: |-
        An ISO 3166-1 alpha-2 country code, uppercase: `FR`, `US`. The list of
        assigned codes is not in the pattern: only the shape is.

        Specified by https://www.iso.org/iso-3166-country-codes.html.
      x-nxgt-scalar: CountryCode
    Cuid2:
      type: string
      pattern: ^[a-z][a-z0-9]{1,31}$
      format: cuid2
      description: |-
        A Cuid2: a lower-case letter, then lower-case letters and digits, 2 to 32
        characters in all (24 by default).

        Specified by https://github.com/paralleldrive/cuid2.
      x-nxgt-scalar: Cuid2
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      format: currency
      description: |-
        An ISO 4217 currency code, uppercase: `EUR`, `USD`. The list of codes in
        force is not in the pattern: only the shape is.

        Specified by https://www.iso.org/iso-4217-currency-codes.html.
      x-nxgt-scalar: Currency
    Date:
      type: string
      pattern: ^(?:\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:\d\d(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)$
      format: date
      description: |-
        A calendar date, `YYYY-MM-DD`, with no time and no time zone: `2024-02-29`. An impossible
        day, such as `2023-02-29`, is refused.

        Specified by https://www.rfc-editor.org/rfc/rfc3339#section-5.6.
      x-nxgt-scalar: Date
    DateTime:
      type: string
      pattern: ^(?:\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:\d\d(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)(?:Z|\+(?:[01]\d|2[0-3]):[0-5]\d|-(?!00:00)(?:[01]\d|2[0-3]):[0-5]\d)$
      format: date-time
      description: |-
        An RFC 3339 date-time with its offset, `Z` or `±hh:mm`, kept as sent: `2024-03-10T12:00:00+02:00`.
        A time with no offset names no instant and is refused, and so is the offset `-00:00`:
        write `Z` or `+00:00`. An impossible day is refused. The range 0000 to 9999 in UTC is
        not in the pattern, nor is the leap second.

        Specified by https://www.rfc-editor.org/rfc/rfc3339.
      x-nxgt-scalar: DateTime
    DateTimeScalars:
      type: object
      required:
        - date
        - dateTime
        - isoDuration
        - localDateTime
        - localTime
        - time
        - timeZone
        - timestamp
        - utcOffset
      properties:
        date:
          $ref: '#/components/schemas/Date'
        dateTime:
          $ref: '#/components/schemas/DateTime'
        isoDuration:
          $ref: '#/components/schemas/Duration'
        localDateTime:
          $ref: '#/components/schemas/LocalDateTime'
        localTime:
          $ref: '#/components/schemas/LocalTime'
        time:
          $ref: '#/components/schemas/Time'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        utcOffset:
          $ref: '#/components/schemas/UtcOffset'
    Duration:
      type: string
      pattern: ^P(?:\d+W|(?!.*W)(?=\d|T\d)(?:\d+Y)?(?:\d+M)?(?:\d+D)?(?:T(?=\d)(?:\d+H)?(?:\d+M)?(?:\d+(?:[.,]\d+)?S)?)?)$
      format: duration
      description: |-
        An ISO 8601 duration, kept as sent and not normalised: `P1DT2H`. Weeks are not mixed with
        other units, and there is no sign. Named `isoDuration` because `duration` is TypeSpec's own.

        Specified by https://www.iso.org/iso-8601-date-and-time-format.html.
      x-nxgt-scalar: Duration
    EmailAddress:
      type: string
      pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+\-]@(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?:[A-Za-z]{2,63}|xn--[A-Za-z0-9-]{1,59})$
      format: email
      description: |-
        An e-mail address, in any case, kept as sent: `ada@example.com`. The local
        part is letters, digits, `_`, `'`, `+`, `-` and dots between them, with no
        quoted form; the domain is at least two labels, as `hostname` takes them,
        the last of letters or `xn--`. Only the shape is checked.
      x-nxgt-scalar: EmailAddress
    Emoji:
      type: string
      pattern: ^(?:\p{Regional_Indicator}{2}|[#*0-9]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*)$
      format: emoji
      description: |-
        One emoji: `😀`, `👍🏽`, `👨‍👩‍👧`, `🇫🇷`, `1️⃣`. A pictograph with an optional variation
        selector or skin tone, joined to others by zero-width joiners; a
        pair of regional indicators (a flag); or a keycap. The pattern is an
        approximation by Unicode properties, so it needs the `u` flag; it does not
        segment user-perceived characters, takes no tag sequence (the flags of England,
        Scotland and Wales) and has no 32 code points limit.

        Specified by https://www.unicode.org/reports/tr51/.
      x-nxgt-scalar: Emoji
    EncodingScalars:
      type: object
      required:
        - base64
        - base64Url
        - hexadecimal
        - jwt
        - sha256
        - sha512
      properties:
        base64:
          $ref: '#/components/schemas/Base64'
        base64Url:
          $ref: '#/components/schemas/Base64URL'
        hexadecimal:
          $ref: '#/components/schemas/Hexadecimal'
        jwt:
          $ref: '#/components/schemas/JWT'
        sha256:
          $ref: '#/components/schemas/SHA256'
        sha512:
          $ref: '#/components/schemas/SHA512'
    FinanceScalars:
      type: object
      required:
        - currency
        - iban
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        iban:
          $ref: '#/components/schemas/IBAN'
    GUID:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      format: uuid
      description: Any 8-4-4-4-12 hexadecimal string, no version or variant check, in any case, kept as sent.
      x-nxgt-scalar: GUID
    GeoScalars:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    HSL:
      type: string
      pattern: ^hsl\((?:3[0-5]\d|[12]\d\d|[1-9]?\d), (?:100|[1-9]?\d)%, (?:100|[1-9]?\d)%\)$
      format: hsl
      description: |-
        A CSS `hsl()` color in the comma syntax: `hsl(120, 100%, 50%)`. A hue from 0
        to 359 with no unit (360 is written 0), then saturation and lightness as
        integer percentages from 0% to 100%.

        Specified by https://www.w3.org/TR/css-color-4/#the-hsl-notation.
      x-nxgt-scalar: HSL
    HSLA:
      type: string
      pattern: ^hsla\((?:3[0-5]\d|[12]\d\d|[1-9]?\d), (?:100|[1-9]?\d)%, (?:100|[1-9]?\d)%, (?:0|1|0\.\d*[1-9])\)$
      format: hsla
      description: |-
        A CSS `hsla()` color in the comma syntax: `hsla(120, 100%, 50%, 0.5)`. As
        `hsl` plus an alpha: `0`, `1`, or a fraction with no trailing zero and a
        leading `0`.

        Specified by https://www.w3.org/TR/css-color-4/#the-hsl-notation.
      x-nxgt-scalar: HSLA
    HexColorCode:
      type: string
      pattern: ^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
      format: hex-color-code
      description: |-
        A CSS hex color: `#` then 3, 4, 6 or 8 hexadecimal digits, in any case, kept
        as sent: `#ff0000`. The 4 and 8 digit forms carry an alpha.

        Specified by https://www.w3.org/TR/css-color-4/#hex-notation.
      x-nxgt-scalar: HexColorCode
    Hexadecimal:
      type: string
      pattern: ^[0-9a-fA-F]+$
      format: hexadecimal
      description: |-
        One or more hexadecimal digits, in any case, kept as sent. An odd length is
        fine; no `0x` prefix.
      x-nxgt-scalar: Hexadecimal
    Hostname:
      type: string
      pattern: ^(?=.{1,253}\.?$)(?!(?:[A-Za-z0-9-]+\.)*(?:\d+|0[xX][0-9a-fA-F]*)\.?$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.?$
      format: hostname
      description: |-
        A host name, kept as sent: `api.example.com`. Dot-separated labels of
        letters, digits and hyphens, none starting or ending with a hyphen, each
        up to 63 characters and 253 in all, with an optional trailing dot. The
        last label is not a number (all digits, or `0x` and hex digits), so an
        IPv4 address is not a host name. A single label (`localhost`) and punycode
        are; a Unicode label is not. Nothing is resolved.

        Specified by https://www.rfc-editor.org/rfc/rfc1123.
      x-nxgt-scalar: Hostname
    IBAN:
      type: string
      pattern: ^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$
      format: iban
      description: |-
        An International Bank Account Number in its electronic form, uppercase, no
        spaces: `FR1420041010050500013M02606`. Two letters, two check digits, then
        11 to 30 letters or digits. The checksum (ISO 13616, mod 97) and the
        country and its length are not in the pattern.

        Specified by https://www.iso.org/standard/81090.html.
      x-nxgt-scalar: IBAN
    IP:
      type: string
