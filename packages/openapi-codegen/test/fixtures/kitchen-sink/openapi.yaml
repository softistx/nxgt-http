# One schema per mapping row, and one parameter per way a value reaches a
# request, so the golden files show every one of them.
openapi: 3.1.0
info:
  title: Kitchen sink
  version: 0.0.1
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getPet
      summary: Fetch a pet.
      parameters:
        - name: fields
          in: query
          description: Which fields to return.
          schema: { type: array, items: { type: string } }
        - name: ids
          in: query
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: verbose
          in: query
          schema: { type: boolean, default: false }
        - name: level
          in: query
          schema: { enum: [1, 2, max] }
        - name: tier
          in: query
          schema: { $ref: '#/components/schemas/Tier' }
        - name: X-Request-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '304':
          description: Not modified.
    delete:
      operationId: deletePet
      deprecated: true
      summary: Delete a pet.
      description: Pets are archived instead.
      responses:
        '204':
          description: Gone.
  /pets/{petId}/tags:
    put:
      operationId: putTags
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /uploads:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/Upload' }
          application/octet-stream: {}
      responses:
        '200':
          description: A receipt.
          content:
            text/plain: {}
        '201':
          description: The document.
          content:
            application/pdf: {}
components:
  schemas:
    Formats:
      type: object
      required: [when]
      properties:
        when: { type: string, format: date-time }
        day: { type: string, format: date }
        at: { type: string, format: time }
        took: { type: string, format: duration }
        email: { type: string, format: email }
        site: { type: string, format: uri }
        id: { type: string, format: uuid }
        v4: { type: string, format: ipv4 }
        v6: { type: string, format: ipv6 }
        blob: { type: string, format: byte }
        code: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]+/[0-9]+$' }
        slug: { type: string, pattern: '^[a-z/-]+$' }
    Status:
      description: Where an employee stands.
      type: string
      enum: [active, on_leave, left]
    Tier:
      type: integer
      enum: [1, 2, 3]
    Grade:
      enum: [low, 2]
    MaybeStatus:
      type: [string, 'null']
      enum: [on, off, null]
    Coded:
      type: string
      enum: [a-1, b-2]
      x-enum-varnames: [Alpha, Beta]
    Flagged:
      enum: ['yes', true]
    Numbers:
      type: object
      properties:
        count: { type: integer, format: int32, minimum: 0 }
        big: { type: integer, format: int64 }
        ratio: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        step: { type: number, multipleOf: 0.5 }
    Literals:
      type: object
      properties:
        status: { type: string, enum: [open, closed] }
        maybe: { type: [string, 'null'], enum: ['yes', 'no', null] }
        one: { const: 1 }
        mixed: { enum: [a, 1, true] }
    Defaults:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        sort: { type: string, enum: [asc, desc], default: asc }
        filter:
          type: object
          properties: { q: { type: string } }
          default: {}
        tags: { type: array, items: { type: string }, default: [] }
        note: { type: [string, 'null'], default: null }
    UsesDefaults:
      type: object
      properties:
        defaults: { $ref: '#/components/schemas/Defaults' }
    Maps:
      type: object
      properties:
        counts: { type: object, additionalProperties: { type: integer } }
        anything: { type: object }
        maybeObject:
          type: [object, 'null']
          properties: { x: { type: string } }
    Strict:
      type: object
      additionalProperties: false
      properties: { a: { type: string } }
    Loose:
      type: object
      additionalProperties: true
      properties: { a: { type: string } }
    Catchall:
      type: object
      additionalProperties: { type: integer }
      properties: { a: { type: integer } }
    Cat:
      type: object
      required: [kind, lives]
      properties:
        kind: { const: cat }
        lives: { type: integer }
    Dog:
      type: object
      required: [kind]
      properties:
        kind: { const: dog }
        good: { type: boolean }
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator: { propertyName: kind }
    MaybePet:
      type: object
      properties:
        pet:
          oneOf:
            - $ref: '#/components/schemas/Pet'
            - type: 'null'
    StringOrNumber:
      type: [string, number]
    Timestamps:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
    Named:
      allOf:
        - $ref: '#/components/schemas/Strict'
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties: { name: { type: string } }
      required: [a]
    Owned:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties: { owner: { type: string } }
    Tree:
      type: object
      required: [value]
      properties:
        value: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Tree' }
    Nested:
      type: array
      items: { $ref: '#/components/schemas/Nested' }
    Ping:
      type: object
      properties:
        pong: { $ref: '#/components/schemas/Pong' }
    Pong:
      type: object
      required: [n]
      properties:
        n: { type: integer }
        ping: { $ref: '#/components/schemas/Ping' }
    Keys:
      type: object
      properties:
        x-trace-id: { type: string }
        __proto__: { type: string }
        default: { type: string }
    Documented:
      description: |-
        A schema with docs.
        A second line, with */ in it.
      deprecated: true
      type: object
      properties:
        old: { type: string, deprecated: true, description: Use `new`. }
    Upload:
      type: object
      required: [copies]
      properties:
        file: { type: string, format: binary }
        copies: { type: integer, minimum: 1 }
        public: { type: boolean, default: false }
        labels: { type: array, items: { type: string } }
    Identifier:
      $ref: '#/components/schemas/Strict'
    Payment:
      description: A card or a bank account, and no key either one does not declare.
      unevaluatedProperties: false
      oneOf:
        - type: object
          required: [object, number]
          properties:
            object: { const: card }
            number: { type: string }
        - type: object
          required: [object, account]
          properties:
            object: { const: bank_account }
            account: { type: string }
    Settings:
      description: An object default, whose own defaults are filled in on parse.
      type: object
      properties:
        theme:
          type: object
          properties:
            mode: { type: string, default: light }
          default: {}
    Branch:
      type: object
      properties:
        label: { type: string }
        children: { type: array, items: { $ref: '#/components/schemas/Branch' } }
    LabelledBranch:
      description: Requires a property of a recursive parent.
      allOf:
        - $ref: '#/components/schemas/Branch'
      required: [label]
    Sized:
      type: object
      properties:
        size: { type: integer, default: 1 }
    Resized:
      description: Restates a parent's property that has a default.
      allOf:
        - $ref: '#/components/schemas/Sized'
        - type: object
          properties:
            size: { type: integer, minimum: 0 }
    Notes:
      type: array
      items:
        oneOf:
          - type: object
            properties:
              text: { type: string, description: "It's (sometimes empty" }
          - type: object
            properties:
              count: { type: integer }
    Letters:
      type: string
      pattern: '^\p{L}+$'
    Alarm:
      type: string
      format: time
