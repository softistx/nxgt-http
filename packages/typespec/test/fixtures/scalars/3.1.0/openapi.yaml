components:
  schemas:
    ColorScalars:
      type: object
    Date:
      type: string
      pattern: ^(?:\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:\d\d(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)$
      format: date
      description: |-
        A calendar date, `YYYY-MM-DD`, with no time and no time zone: `2024-02-29`. An impossible
        day, such as `2023-02-29`, is refused.

        Specified by https://www.rfc-editor.org/rfc/rfc3339#section-5.6.
      x-nxgt-scalar: Date
    DateTime:
      type: string
      pattern: ^(?:\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:\d\d(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)(?:Z|\+(?:[01]\d|2[0-3]):[0-5]\d|-(?!00:00)(?:[01]\d|2[0-3]):[0-5]\d)$
      format: date-time
      description: |-
        An RFC 3339 date-time with its offset, `Z` or `±hh:mm`, kept as sent: `2024-03-10T12:00:00+02:00`.
        A time with no offset names no instant and is refused, and so is the offset `-00:00`:
        write `Z` or `+00:00`. An impossible day is refused. The range 0000 to 9999 in UTC is
        not in the pattern, nor is the leap second.

        Specified by https://www.rfc-editor.org/rfc/rfc3339.
      x-nxgt-scalar: DateTime
    DateTimeScalars:
      type: object
      required:
        - date
        - dateTime
        - isoDuration
        - localDateTime
        - localTime
        - time
        - timeZone
        - timestamp
        - utcOffset
      properties:
        date:
          $ref: '#/components/schemas/Date'
        dateTime:
          $ref: '#/components/schemas/DateTime'
        isoDuration:
          $ref: '#/components/schemas/Duration'
        localDateTime:
          $ref: '#/components/schemas/LocalDateTime'
        localTime:
          $ref: '#/components/schemas/LocalTime'
        time:
          $ref: '#/components/schemas/Time'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        utcOffset:
          $ref: '#/components/schemas/UtcOffset'
    Duration:
      type: string
      pattern: ^P(?:\d+W|(?!.*W)(?=\d|T\d)(?:\d+Y)?(?:\d+M)?(?:\d+D)?(?:T(?=\d)(?:\d+H)?(?:\d+M)?(?:\d+(?:[.,]\d+)?S)?)?)$
      format: duration
      description: |-
        An ISO 8601 duration, kept as sent and not normalised: `P1DT2H`. Weeks are not mixed with
        other units, and there is no sign. Named `isoDuration` because `duration` is TypeSpec's own.

        Specified by https://www.iso.org/iso-8601-date-and-time-format.html.
      x-nxgt-scalar: Duration
    EmailAddress:
      type: string
      pattern: ^[A-Za-z0-9_'+\-]+(?:\.[A-Za-z0-9_'+\-]+)*@(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?:[A-Za-z]{1,63}|xn--[A-Za-z0-9-]{1,59})$
      format: email
      description: |-
        An e-mail address, in any case, kept as sent: `ada@example.com`. The local
        part is letters, digits, `_`, `'`, `+`, `-` and dots between them, with no
        quoted form; the domain is at least two labels, as `hostname` takes them,
        the last of letters or `xn--`. Only the shape is checked.
      x-nxgt-scalar: EmailAddress
    EncodingScalars:
      type: object
    FinanceScalars:
      type: object
    GUID:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      format: uuid
      description: Any 8-4-4-4-12 hexadecimal string, no version or variant check, in any case, kept as sent.
      x-nxgt-scalar: GUID
    GeoScalars:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    IdentifierScalars:
      type: object
      required:
        - guid
        - uuid
        - uuidV4
        - uuidV7
      properties:
        guid:
          $ref: '#/components/schemas/GUID'
        uuid:
          $ref: '#/components/schemas/UUID'
        uuidV4:
          $ref: '#/components/schemas/UUIDv4'
        uuidV7:
          $ref: '#/components/schemas/UUIDv7'
    Latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
      description: 'A latitude in decimal degrees, WGS 84, from -90 to 90: `48.8566`. A number, never a string.'
      x-nxgt-scalar: Latitude
    LocalDateTime:
      type: string
      pattern: ^(?:\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:\d\d(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?$
      format: local-date-time
      description: |-
        A date and a time on the wall clock, with no offset, not even `Z`: `2024-03-10T10:15:30`.
        The seconds are optional. An impossible day is refused.
      x-nxgt-scalar: LocalDateTime
    LocalTime:
      type: string
      pattern: ^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?$
      format: local-time
      description: |-
        A time of day with no offset, `HH:MM`, `HH:MM:SS` or with a fraction: `10:15`. It names no
        instant until a date and a place are given; a `Z` or an offset is refused.
      x-nxgt-scalar: LocalTime
    LocaleScalars:
      type: object
    Longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
      description: 'A longitude in decimal degrees, WGS 84, from -180 to 180: `2.3522`. A number, never a string.'
      x-nxgt-scalar: Longitude
    NetworkScalars:
      type: object
      required:
        - emailAddress
      properties:
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
    NumberScalars:
      type: object
    StringScalars:
      type: object
    Time:
      type: string
      pattern: ^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)(?:\.\d+)?(?:Z|\+(?:[01]\d|2[0-3]):[0-5]\d|-(?!00:00)(?:[01]\d|2[0-3]):[0-5]\d)$
      format: time
      description: |-
        An RFC 3339 `full-time`, kept as sent: seconds, an optional fraction, then `Z` or `±hh:mm`,
        such as `10:15:30+02:00`. A time with no offset is refused, and so is `-00:00`.

        Specified by https://www.rfc-editor.org/rfc/rfc3339#section-5.6.
      x-nxgt-scalar: Time
    TimeZone:
      type: string
      pattern: ^[A-Z][A-Za-z0-9+\-_]*(?:/[A-Z][A-Za-z0-9+\-_]*){0,2}$
      format: time-zone
      description: |-
        An IANA time zone name in its exact case, kept as sent: `Europe/Paris`, `UTC`. Only the shape
        is checked, one to three words of letters, digits, `+`, `-` and `_`, each starting with a capital;
        the list of names is not in the pattern.

        Specified by https://www.iana.org/time-zones.
      x-nxgt-scalar: TimeZone
    Timestamp:
      type: integer
      format: int64
      minimum: -8640000000000000
      maximum: 8640000000000000
      description: |-
        An instant as an integer number of milliseconds since 1970-01-01T00:00:00Z, negative before
        1970, within the range of a JavaScript `Date`, ±8640000000000000: `1710065730000`.
      x-nxgt-scalar: Timestamp
    UUID:
      type: string
      pattern: ^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|0{8}-0{4}-0{4}-0{4}-0{12}|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
      format: uuid
      description: |-
        An RFC 9562 UUID, any version 1 to 8 with the RFC variant, or the nil or
        the max UUID, in any case, kept as sent: `0b8e5c1e-2f4a-4c3b-9d6e-7f8a9b0c1d2e`.

        Specified by https://www.rfc-editor.org/rfc/rfc9562.
      x-nxgt-scalar: UUID
    UUIDv4:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      format: uuid
      description: |-
        A version 4 (random) UUID with the RFC variant, in any case, kept as sent.

        Specified by https://www.rfc-editor.org/rfc/rfc9562.
      x-nxgt-scalar: UUIDv4
    UUIDv7:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      format: uuid
      description: |-
        A version 7 (time-ordered) UUID with the RFC variant, in any case, kept as sent.

        Specified by https://www.rfc-editor.org/rfc/rfc9562.
      x-nxgt-scalar: UUIDv7
    UtcOffset:
      type: string
      pattern: ^(?:\+(?:0\d|1[0-3]):[0-5]\d|\+14:00|-(?!00:00)(?:0\d|1[01]):[0-5]\d|-12:00)$
      format: utc-offset
      description: |-
        A fixed offset from UTC, `±hh:mm`, from `-12:00` to `+14:00`: `+05:30`. It is not a place and
        knows nothing of daylight saving. `-00:00` is refused: write `+00:00`.
      x-nxgt-scalar: UtcOffset
