openapi: 3.1.0
info:
  title: Scalars
  version: 0.0.0
tags: []
paths:
  /color:
    post:
      operationId: color
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorScalars'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorScalars'
  /date-time:
    post:
      operationId: dateTime
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
