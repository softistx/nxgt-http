type: object
description: Opening hours for a specific day (can be used for places, services, etc.)
properties:
  dayOfWeek:
    type: integer
    minimum: 0
    maximum: 6
    description: Day of the week (0=Sunday, 1=Monday, ..., 6=Saturday)
    example: 1
  openTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Opening time in HH:mm format
    example: "08:30"
  closeTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Closing time in HH:mm format
    example: "18:00"
  isClosed:
    type: boolean
    description: Whether the place is closed on this day
required:
  - dayOfWeek
